# NOTE: evals/run.mjs is NOT a valid box gate — it tests the box's LIVE runtime copies
# (/root/.claude/helpers), not the nightly clone, and requires 100% incl. env-dependent
# cases. Gate below syntax-checks every .mjs/.sh in the CLONE (what nightly actually edits).
